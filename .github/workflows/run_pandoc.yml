name: Convert DOCX to Markdown

on:
  push:
    branches:
      - development
    paths:
      - "**/*.docx"  # Only trigger when a .docx file is changed
  pull_request:
    branches:
      - development

jobs:
  convert-docx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc  # Install Pandoc
          pip install --upgrade pip

      - name: Run the script
        run: |
          python convert_docx.py ./DDIA

      - name: Upload converted files
        uses: actions/upload-artifact@v4
        with:
          name: converted-markdown
          path: ./DDIA/*.md

      - name: Commit and push changes
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git fetch origin ${{ github.head_ref || github.ref_name }}  # Ensure we have latest changes
          git checkout ${{ github.head_ref || github.ref_name }}  # Switch to correct branch

          git add .
          git commit -m "Automated conversion of DOCX to Markdown" || echo "No changes to commit"
          
          # Push safely (rebase if needed)
          git pull --rebase origin ${{ github.head_ref || github.ref_name }} || true
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.head_ref || github.ref_name }}
          